services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lms_db}"], interval: 10s, timeout: 5s, retries: 10 }
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lms_db}
      FRONTEND_URL: ${APP_URL:?APP_URL is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:?MOCK_PAYMENT_WEBHOOK_SECRET is required}
    command: sh -c "npm run db:deploy && npm start"
    volumes: [uploads:/app/uploads]
    depends_on: { postgres: { condition: service_healthy } }
  frontend:
    build: { context: ./frontend, args: { VITE_API_BASE_URL: /api/v1 } }
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    depends_on: [backend]
volumes: { postgres_data: {}, uploads: {} }
