name: LMS CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start development stack
        run: docker compose up -d --build postgres backend frontend
      - name: Wait for API
        run: for i in {1..30}; do curl -fsS http://localhost:3000/api/v1/health && exit 0; sleep 2; done; exit 1
      - name: Migrate and seed
        run: docker compose exec -T backend npm run db:deploy && docker compose exec -T backend npm run db:seed
      - name: Backend tests
        run: docker compose exec -T backend npm test && docker compose exec -T backend npm run test:integration
      - name: Frontend build
        run: docker compose exec -T frontend npm run build
      - name: Install E2E browser
        run: docker compose exec -T frontend npx playwright install --with-deps chromium
      - name: Critical E2E journeys
        run: docker compose exec -T frontend npm run test:e2e
