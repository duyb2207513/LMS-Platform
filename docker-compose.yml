services:
  postgres:
    image: postgres:17-alpine
    container_name: lms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lms_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    env_file:
      - path: ./backend/.env
        required: false

    container_name: lms-backend
    # Development uses bind mounts and runs generators/tests that write to the host workspace.
    # The production image still runs as the non-root `node` user.
    user: root
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    environment:
      NODE_ENV: development
      PORT: 3000
      MOBILE_APP_URL: lmsplatform://

      DATABASE_URL: postgresql://postgres.ckdntlkhwalaggjwinik:MyStrongPass123%21%40%23@aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres
      JWT_ACCESS_SECRET: local-development-access-secret-change-me
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-me
      MOCK_PAYMENT_WEBHOOK_SECRET: local-mock-payment-webhook-secret
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_WINDOW_MS: 900000
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_LOCK_MINUTES: 15
      REQUIRE_EMAIL_VERIFICATION: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-456249048931-5aa460ojovj1qfo7ap3hbv7qauh7avdj.apps.googleusercontent.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-LMS Platform <no-reply@lms.local>}
      ASSIGNMENT_REMINDER_INTERVAL_MINUTES: ${ASSIGNMENT_REMINDER_INTERVAL_MINUTES:-15}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lms-frontend
    working_dir: /app

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-456249048931-5aa460ojovj1qfo7ap3hbv7qauh7avdj.apps.googleusercontent.com}}
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0

    depends_on:
      backend:
        condition: service_healthy

  mobile:
    build:
      context: ./mobile

    container_name: lms-mobile
    working_dir: /app
    stdin_open: true
    tty: true

    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"

    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules

    environment:
      EXPO_PUBLIC_API_URL: ${MOBILE_API_URL:-http://10.0.2.2:3000/api/v1}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${GOOGLE_CLIENT_ID:-456249048931-5aa460ojovj1qfo7ap3hbv7qauh7avdj.apps.googleusercontent.com}
      EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID:-}
      EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID:-}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${EXPO_PUBLIC_EAS_PROJECT_ID:-}
      EXPO_PUBLIC_SENTRY_DSN: ${EXPO_PUBLIC_SENTRY_DSN:-}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${MOBILE_HOST_IP:-10.0.2.2}
      WATCHPACK_POLLING: "true"

    command: npm run start -- --lan --clear

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  mobile_node_modules:
