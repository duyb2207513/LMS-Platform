services:
  postgres:
    image: postgres:17-alpine
    container_name: lms-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lms_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: lms-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/lms_db
      JWT_ACCESS_SECRET: local-development-access-secret-change-me
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-me
      MOCK_PAYMENT_WEBHOOK_SECRET: local-mock-payment-webhook-secret

    depends_on:
      postgres:
        condition: service_healthy

    command: npm run dev

  frontend:
    image: node:22-bookworm-slim
    container_name: lms-frontend
    working_dir: /app

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1

    command: npm run dev -- --host 0.0.0.0

    depends_on:
      - backend

  mobile:
    build:
      context: ./mobile

    container_name: lms-mobile
    working_dir: /app
    stdin_open: true
    tty: true

    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"

    volumes:
      - ./mobile:/app
      - mobile_node_modules:/app/node_modules

    environment:
      EXPO_PUBLIC_API_URL: ${MOBILE_API_URL:-http://10.0.2.2:3000/api/v1}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${MOBILE_HOST_IP:-10.0.2.2}
      WATCHPACK_POLLING: "true"

    command: npm run start -- --lan --clear

    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
  mobile_node_modules:
